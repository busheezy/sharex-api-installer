networks:
  sharex:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - sharex
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/busheezy/sharex-api:latest
    restart: unless-stopped
    networks:
      - sharex
    volumes:
      - ./docker/nest-sharex/uploads:/app/uploads
      - ./docker/nest-sharex/thumbnails:/app/thumbnails
    depends_on:
      db:
        condition: service_healthy
    env_file: '.env'{{? it.port }}
    ports:
      - '{{= it.port }}:3000'{{?}}

  front:
    image: ghcr.io/busheezy/sharex-paste-front:latest
    networks:
      - sharex
    depends_on:
      - api
    volumes:
      - ./docker/vite/dist:/vite-sharex/dist
    env_file: '.env'
{{? !it.port }}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - sharex
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./docker/caddy/caddy_data:/data
      - ./docker/caddy/caddy_config:/config
      - ./docker/vite/dist:/srv/vite/dist
{{?}}